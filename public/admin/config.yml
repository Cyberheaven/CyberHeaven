backend:
  name: github
  repo: Cyberheaven/CyberHeaven
  branch: main

media_folder: public/media
public_folder: /media

collections:
  - name: articles
    label: Articles
    folder: src/content/articles
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { name: title, label: Title, widget: string, required: true }
      - name: category
        label: Category
        widget: select
        options: [Tutorials, Career Guides, Cheat Sheets, Cybersecurity News, Free Resources, Learning Roadmaps]
      - name: date
        label: Date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - { name: author, label: Author, widget: string }
      - { name: excerpt, label: Excerpt, widget: text, hint: Short summary }
      - { name: cover, label: Cover image, widget: image }
      - name: coverAlt
        label: Cover alt text
        widget: string
        hint: Describes the cover image for screen reader users
      - { name: tags, label: Tags, widget: list, required: false, default: [] }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Body, widget: markdown }

  - name: pages
    label: Pages
    folder: src/content/pages
    create: false
    delete: false
    extension: md
    format: frontmatter
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: string }
      - { name: body, label: Body, widget: markdown }
