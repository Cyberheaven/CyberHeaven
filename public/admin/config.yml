backend:
  name: github
  repo: Cyberheaven/cyberheaven.github.io
  branch: main
  # People without write access can still edit: the CMS works in their own fork and sends a pull request.
  open_authoring: true
  auth_scope: public_repo
  # "Sign In with GitHub" goes through our small login service on Cloudflare: see docs/cms-login.md
  base_url: https://sveltia-cms-auth.cyberheavenhq.workers.dev

# Every change is saved to its own branch and pull request first (Draft → In review → Ready), and only goes
# live when someone allowed to publishes it. Who may publish what is set on GitHub: see .github/CODEOWNERS.
publish_mode: editorial_workflow

media_folder: public/media
public_folder: /media
# Photos and screenshots are turned into WebP when they're uploaded (several times smaller than PNG, so pages load
# faster), and shrunk to fit 2000 × 2000 px. SVGs and images already on the site stay as they are.
media_libraries:
  default:
    config:
      transformations:
        raster_image: { format: webp, quality: 85, width: 2000, height: 2000 }

# Branding: name in the browser tab and on the login page, logo (also the tab icon), and where the
# logo and the "view site" link go. The look itself (colours, font, buttons) is in theme.css.
app_title: CyberHeaven CMS
logo:
  src: /admin/logo.webp
display_url: /

# The sidebar: writing first, then the site's text, then the lists and labs, then settings.
# "divider: true" draws a line between groups. Icons are Material Symbols names (fonts.google.com/icons).
collections:
  - name: articles
    label: Articles
    label_singular: Article
    icon: article
    description: "Guides and tutorials. Saving keeps your work as a draft; it goes live when a maintainer or editor publishes it."
    folder: src/content/articles
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{draft | ternary('Hidden · ', '')}}{{title}} · {{category}} · {{date | date('D MMM YYYY')}}"
    sortable_fields:
      fields: [date, title, category]
      default: { field: date, direction: descending }
    view_groups:
      groups:
        - { name: category, label: Category, field: category }
    fields:
      - { name: title, label: Title, widget: string, required: true }
      - name: category
        label: Category
        widget: relation
        collection: settings
        file: categories
        value_field: "articles.*.name"
        search_fields: ["articles.*.name"]
        display_fields: ["articles.*.name"]
        hint: Add or rename categories under Settings → Categories.
      - name: date
        label: Date
        widget: datetime
        default: "{{now}}"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - name: author
        label: Author
        widget: relation
        collection: people
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
        hint: Pick a person from Team members. New author? Add them under Team members first.
      - { name: excerpt, label: Excerpt, widget: text, hint: "One or two sentences. Shown on the articles list and in Google results." }
      - { name: cover, label: Cover image, widget: image }
      - name: coverAlt
        label: Cover alt text
        widget: string
        hint: Describes the cover image for screen reader users
      - { name: tags, label: Tags, widget: list, required: false, default: [] }
      - name: draft
        label: Hide from the site
        widget: boolean
        default: false
        required: false
        hint: "Takes a published article off the site (and the homepage carousel) without deleting it. Links to it from other pages must go first: the checks list them."
      - name: body
        label: Body
        widget: markdown
        hint: "Interactive widget: Insert → Interactive widget. YouTube video: paste the link on its own line. Tip, Warning and Key takeaways boxes: Insert menu."
        # A new article starts with this outline. Replace each ✏️ note: the checks refuse to publish while one is left
        # (the mark is outlineMark in src/lib/content-rules.mjs).
        default: |-
          ## What you'll learn

          ✏️ One or two sentences: what the reader will be able to do after reading this.

          ## Before you start

          ✏️ What the reader needs first: tools, accounts, or another article to read. Delete this section if nothing.

          ## Step 1: Rename this heading

          ✏️ Explain the first step. Add more steps the same way, each with its own heading.

          ## Key takeaways

          ✏️ Three or four short points to remember. Insert → Key takeaways makes a box for them.

  # The text of every page, one entry per page. Files live in src/content/pages.
  # Text in {curly brackets} is filled in when the site is built, e.g. {count} becomes a number.
  - name: pages
    label: Pages
    label_singular: Page
    icon: web
    description: "The text on every page of the site, one entry per page. The About section, values, ticker, FAQ and contact section also appear on the About and Join pages, but are edited under Home. Text in {curly brackets} is filled in automatically: keep it as it is."
    editor: { preview: false }
    files:
      - name: home
        label: Home
        file: src/content/pages/home.json
        format: json
        fields:
          - { name: tagline, label: Tagline, widget: text, hint: "The line under the big carousel at the top." }
          - name: heroArticles
            label: Carousel articles
            label_singular: Carousel article
            widget: list
            required: false
            max: 6
            hint: "The big scrolling carousel at the top, in this order (drag to reorder, up to 6). Leave empty to show the 5 newest articles."
            field: { name: article, label: Article, widget: relation, collection: articles, value_field: "{{slug}}", search_fields: [title], display_fields: [title] }
          - name: about
            label: About section
            widget: object
            collapsed: true
            summary: "{{fields.statement}}"
            hint: "Also shown on the About page."
            fields:
              - { name: label, label: Small label, widget: string }
              - { name: statement, label: Big statement, widget: text }
              - { name: bio, label: Paragraph, widget: text }
              - { name: contactLead, label: Text before the email address, widget: string }
              - { name: contactTail, label: Text after the email address, widget: string }
              - { name: moreLink, label: Link to the About page, widget: string }
          - { name: principlesHeading, label: Values heading, widget: string, hint: "{count} is the number of values. Also shown on the About page." }
          - name: principles
            label: Values
            label_singular: Value
            widget: list
            collapsed: auto
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }
              - { name: icon, label: Icon, widget: select, options: [target, accessibility, users, heart] }
              - { name: image, label: Image, widget: image }
              - { name: alt, label: Image description, widget: string, hint: "For screen reader users" }
          - { name: ticker, label: Scrolling ticker text, widget: string, hint: "Also shown on the About page." }
          - { name: topicsHeading, label: Topics heading, widget: string }
          - name: topics
            label: Topics
            label_singular: Topic
            widget: list
            collapsed: auto
            summary: "{{fields.name}}"
            hint: "Labs on the Interactive page are grouped by these topics, in this order."
            fields:
              - { name: name, label: Name, widget: string }
              - { name: image, label: Image, widget: image }
              - { name: alt, label: Image description, widget: string, required: false }
              - { name: captions, label: Captions, label_singular: Caption, widget: list, hint: "The three lines shown next to the image." }
          - { name: toolsHeading, label: Labs heading, widget: string, hint: "The labs shown are the ones marked Featured under Pages → Interactive." }
          - { name: toolsLink, label: Labs link text, widget: string }
          - { name: picksHeading, label: Resources heading, widget: string, hint: "The resources shown are the ones marked “Show on homepage” in the Resource list." }
          - { name: picksLink, label: Resources link text, widget: string, hint: "{count} is the number of resources." }
          - { name: faqHeading, label: FAQ heading, widget: string, hint: "Also shown on the Join page." }
          - name: faq
            label: FAQ
            label_singular: Question
            widget: list
            collapsed: auto
            summary: "{{fields.q}}"
            fields:
              - { name: q, label: Question, widget: string }
              - { name: a, label: Answer, widget: text }
          - name: contact
            label: Contact section
            widget: object
            collapsed: true
            summary: "{{fields.heading}}"
            hint: "Also shown on the About page. The buttons link to the Discord and email set under Settings → Site."
            fields:
              - { name: heading, label: Heading, widget: text }
              - { name: label, label: Discord label, widget: string }
              - { name: text, label: Discord text, widget: text }
              - { name: button, label: Discord button, widget: string }
              - { name: contributeLabel, label: Contribute label, widget: string }
              - { name: contributeText, label: Contribute text, widget: text }
              - { name: contributeButton, label: Contribute button, widget: string }

      - name: articles
        label: Articles
        file: src/content/pages/articles.json
        format: json
        fields:
          - { name: title, label: Heading, widget: string }
          - { name: lead, label: Intro, widget: text }
          - { name: seo, label: Search engine description, widget: text, hint: "Shown in Google results and link previews." }

      - name: interactive
        label: Interactive
        file: src/content/pages/interactive.json
        format: json
        fields:
          - { name: title, label: Heading, widget: string }
          - { name: lead, label: Intro, widget: text }
          - { name: seo, label: Search engine description, widget: text, hint: "Shown in Google results and link previews." }
          - { name: startHeading, label: '"Start here" heading', widget: string }
          - { name: startText, label: '"Start here" text', widget: text }
          - name: tools
            label: Labs and tools
            label_singular: Lab or tool
            widget: list
            collapsed: auto
            summary: "{{fields.title}} · {{fields.href}}"
            hint: "Each one's card, and the heading and intro on its own page. The exercises inside the labs are under Lab exercises."
            fields:
              - { name: title, label: Title, widget: string, hint: "On the card, and the page heading too unless one is set below." }
              - { name: heading, label: Page heading, widget: string, required: false, hint: "Only if the page heading should differ from the title." }
              - { name: description, label: Card text, widget: text }
              - { name: href, label: Link, widget: string, pattern: ["^/", "Must be a page on this site, starting with /"], hint: "e.g. /play/soc. Every lab page needs an entry here, or the site won't build." }
              - { name: topic, label: Topic, widget: string, required: false, hint: "One of the topics under Pages → Home, or a lab topic below. Leave empty to show it under \"Start here\"." }
              - { name: featured, label: Featured on the homepage, widget: boolean, default: false, required: false }
              - { name: specimen, label: Sample line, widget: string, required: false, hint: "A line of data from the lab, shown in code style on the card." }
              - { name: lead, label: Page intro, widget: text, hint: "{count} works on Spot the phish (number of messages) and Glossary (number of terms)." }
              - { name: seo, label: Search engine description, widget: text, hint: "{count} works on Glossary." }
          - name: labTopics
            label: Lab topics
            label_singular: Lab topic
            widget: list
            collapsed: auto
            summary: "{{fields.name}}"
            hint: "Extra topics for labs that aren't homepage topics, with their image."
            fields:
              - { name: name, label: Name, widget: string }
              - { name: image, label: Image, widget: image }

      - name: resources
        label: Resources
        file: src/content/pages/resources.json
        format: json
        fields:
          - { name: title, label: Heading, widget: string }
          - { name: lead, label: Intro, widget: text, hint: "{count} is the number of resources, {free} the number that are completely free." }
          - { name: seo, label: Search engine description, widget: text, hint: "Shown in Google results and link previews." }
          - { name: disclaimer, label: Disclaimer under the intro, widget: text }
          - { name: note, label: Note at the bottom, widget: text }

      - name: about
        label: About
        file: src/content/pages/about.md
        format: frontmatter
        fields:
          - { name: title, label: Title, widget: string, hint: "Shown in the browser tab. The About section, values, ticker and contact section on this page are edited under Pages → Home." }
          - { name: heading, label: Heading, widget: string }
          - { name: description, label: Intro, widget: text, hint: "Also used in Google results and link previews." }
          - { name: storyHeading, label: Story heading, widget: string }
          - { name: body, label: Story, widget: markdown }
          - { name: waysHeading, label: '"Ways in" heading', widget: string, hint: "{count} is the number of ways, as a word." }
          - name: ways
            label: Ways in
            label_singular: Way in
            widget: list
            collapsed: auto
            summary: "{{fields.name}} · {{fields.href}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: sub, label: Subtitle, widget: string, hint: "{articles} is the number of articles." }
              - { name: text, label: Text, widget: string }
              - { name: href, label: Link, widget: string, pattern: ["^/", "Must be a page on this site, starting with /"] }

      - name: team
        label: Team
        file: src/content/pages/team.json
        format: json
        fields:
          - { name: title, label: Heading, widget: string }
          - { name: lead, label: Intro, widget: text }
          - { name: seo, label: Search engine description, widget: text, hint: "Shown in Google results and link previews." }
          - { name: alumniHeading, label: Past members heading, widget: string }
          - { name: alumniText, label: Past members text, widget: string }
          - { name: joinName, label: Join row title, widget: string }
          - { name: joinSub, label: Join row subtitle, widget: string }
          - { name: joinText, label: Join row text, widget: text }

      - name: join
        label: Join
        file: src/content/pages/join.json
        format: json
        fields:
          - { name: title, label: Heading, widget: string, hint: "The FAQ on this page is edited under Pages → Home." }
          - { name: lead, label: Intro, widget: text }
          - { name: seo, label: Search engine description, widget: text, hint: "Shown in Google results and link previews." }
          - name: channels
            label: Where to find us
            label_singular: Channel
            widget: list
            collapsed: auto
            summary: "{{fields.name}}"
            hint: "The first one is highlighted."
            fields:
              - { name: name, label: Name, widget: string }
              - { name: handle, label: Handle or address, widget: string }
              - { name: href, label: Link, widget: string, hint: "For email use mailto:address" }
              - { name: text, label: Text, widget: text }
          - { name: waysHeading, label: Ways to help heading, widget: string, hint: "{count} is the number of ways, as a word." }
          - name: ways
            label: Ways to help
            label_singular: Way to help
            widget: list
            collapsed: auto
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: action, label: Link text, widget: string }
              - { name: href, label: Link, widget: string, hint: "For email use mailto:address?subject=Your%20subject" }

      - name: legal
        label: Terms, privacy & cookies
        file: src/content/pages/legal.md
        format: frontmatter
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Intro, widget: text, hint: "Also used in Google results and link previews." }
          - { name: body, label: Body, widget: markdown }

      - name: notfound
        label: Page not found
        file: src/content/pages/notfound.json
        format: json
        fields:
          - { name: title, label: Heading, widget: string }
          - { name: text, label: Text, widget: text }
          - { name: homeButton, label: Home button, widget: string }
          - { name: articlesButton, label: Articles button, widget: string }

  - divider: true

  - name: people
    label: Team members
    label_singular: Person
    icon: groups
    description: "Everyone on the team page, and the authors articles can pick."
    folder: src/content/people
    create: true
    slug: "{{name}}"
    identifier_field: name
    extension: md
    format: frontmatter
    summary: "{{name}} · {{roles}}"
    fields:
      - { name: name, label: Name, widget: string }
      - { name: headline, label: Headline, widget: string, required: false, hint: "One line, e.g. DFIR analyst and CTF player" }
      - { name: pronouns, label: Pronouns, widget: string, required: false, hint: "e.g. she/her" }
      - { name: avatar, label: Photo, widget: image, required: false, media_folder: /public/media/people, public_folder: /media/people, hint: "Square works best. Without one, their initials are shown." }
      - name: roles
        label: Roles
        widget: relation
        collection: settings
        file: categories
        value_field: "roles.*.name"
        search_fields: ["roles.*.name"]
        display_fields: ["roles.*.name"]
        multiple: true
        hint: Only maintainers can change roles (the checks refuse it from anyone else). Maintainers add or rename roles under Settings → Categories.
      - { name: location, label: Based in, widget: string, required: false, hint: "e.g. Berlin, Germany" }
      - { name: joined, label: Joined CyberHeaven, widget: datetime, required: false, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - name: links
        label: Links
        label_singular: Link
        widget: list
        required: false
        collapsed: auto
        summary: "{{fields.label}}"
        hint: "Website, GitHub, LinkedIn, X, Mastodon, Bluesky, YouTube, TryHackMe… For email use mailto:name@example.com"
        fields:
          - { name: label, label: Name, widget: select, options: [Website, Blog, GitHub, LinkedIn, X, Mastodon, Bluesky, YouTube, Medium, TryHackMe, Hack The Box, Discord, Email] }
          - { name: url, label: Link, widget: string }
      - { name: alumni, label: Past member, widget: boolean, default: false, required: false, hint: "Moves them to 'With thanks' on the team page" }
      - { name: body, label: Bio, widget: markdown, required: false }

  - name: resources
    label: Resource list
    icon: bookmarks
    description: "The courses, labs, tools and books on /resources. The page's own text is under Pages → Resources."
    editor: { preview: false }
    files:
      - name: resources
        label: All resources
        file: src/data/resources.json
        format: json
        fields:
          - name: items
            label: Resources
            label_singular: Resource
            widget: list
            collapsed: auto
            summary: "{{fields.name}} ({{fields.category}} · {{fields.cost}})"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: provider, label: Provider, widget: string, required: false, hint: "Who makes it, e.g. Harvard or TryHackMe" }
              - { name: url, label: Link, widget: string, pattern: ["^https?://", "Must be a full web address starting with https://"] }
              - { name: description, label: Description, widget: text, hint: "One or two sentences on why it's worth it" }
              - name: category
                label: Category
                widget: relation
                collection: settings
                file: categories
                value_field: "resources.*.name"
                search_fields: ["resources.*.name"]
                display_fields: ["resources.*.name"]
              - { name: cost, label: Cost, widget: select, options: [Free, Free tier, Paid], default: Free, hint: "Never list prices, they change" }
              - { name: level, label: Level, widget: select, options: [Beginner, Intermediate, Advanced, All levels], default: Beginner }
              - { name: featured, label: Show on homepage, widget: boolean, default: false, required: false, hint: "Up to six featured resources appear on the homepage" }

  - name: glossary
    label: Glossary
    icon: menu_book
    description: "The terms on /glossary."
    editor: { preview: false }
    files:
      - name: glossary
        label: Glossary terms
        file: src/data/glossary.json
        format: json
        fields:
          - name: terms
            label: Terms
            label_singular: Term
            widget: list
            collapsed: auto
            summary: "{{fields.term}} ({{fields.category}})"
            fields:
              - { name: term, label: Term, widget: string }
              - { name: definition, label: Definition, widget: text, hint: "Plain English, one or two sentences" }
              - name: category
                label: Topic
                widget: relation
                collection: settings
                file: categories
                value_field: "glossary.*.name"
                search_fields: ["glossary.*.name"]
                display_fields: ["glossary.*.name"]
              - { name: link, label: Learn-more link, widget: string, required: false, hint: "e.g. /articles/linux-command-line-cheat-sheet" }

  # Data for the interactive tools. The career quiz (src/data/career.json) is edited in code.
  - name: interactive
    label: Lab exercises
    icon: experiment
    description: "The exercises inside each lab. Each lab's card and page intro are under Pages → Interactive."
    editor: { preview: false }
    files:
      - name: phishing
        label: Spot the phish
        file: src/data/phishing.json
        format: json
        fields:
          - name: messages
            label: Messages
            label_singular: Message
            collapsed: auto
            widget: list
            summary: "{{fields.subject}}"
            hint: Use made-up companies and people only.
            fields:
              - { name: kind, label: Type, widget: select, options: [Email, Text message] }
              - { name: fromName, label: Sender name, widget: string }
              - { name: fromAddress, label: Sender address or number, widget: string }
              - { name: subject, label: Subject, widget: string }
              - { name: body, label: Message, widget: text }
              - { name: linkText, label: Link text, widget: string, required: false }
              - { name: linkUrl, label: Where the link really goes, widget: string, required: false }
              - { name: phish, label: "Is it phishing?", widget: boolean, default: false }
              - { name: clues, label: Clues, widget: list, hint: "The red flags, or why it is safe" }

      # After editing any lab below, a developer can run `node scripts/check-labs.mjs` to check it still works.
      - name: loghunt
        label: Log hunt
        file: src/data/loghunt.json
        format: json
        fields:
          - name: cases
            label: Cases
            label_singular: Case
            collapsed: auto
            widget: list
            summary: "{{fields.title}}"
            hint: "Use only documentation IP addresses (192.0.2.x, 198.51.100.x, 203.0.113.x) and made-up names."
            fields:
              - { name: title, label: Title, widget: string }
              - { name: file, label: Log file name, widget: string, hint: "e.g. /var/log/auth.log" }
              - { name: intro, label: Intro, widget: text }
              - { name: filters, label: Quick filters, widget: list, field: { name: filter, label: Filter, widget: string }, hint: "Words that are worth searching for" }
              - { name: lines, label: Log lines, widget: list, field: { name: line, label: Line, widget: string }, hint: "One log line per item, oldest first" }
              - name: questions
                label: Questions
                label_singular: Question
                collapsed: auto
                widget: list
                summary: "{{fields.question}}"
                fields:
                  - { name: question, label: Question, widget: string }
                  - { name: answers, label: Accepted answers, widget: list, field: { name: answer, label: Answer, widget: string }, hint: "Upper/lower case and extra spaces are ignored" }
                  - { name: hint, label: Hint, widget: text }
                  - { name: explain, label: Explanation (shown when correct), widget: text }
                  - { name: evidence, label: Evidence text, widget: string, required: false, hint: "Lines containing this light up when the answer is right" }

      - name: decode
        label: Decode the layers
        file: src/data/decode.json
        format: json
        fields:
          - name: challenges
            label: Challenges
            label_singular: Challenge
            collapsed: auto
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: story, label: Story, widget: text }
              - { name: message, label: Hidden message, widget: string, hint: "The plain text learners should end up with. Must contain a flag like CH{something}." }
              - name: layers
                label: Layers (applied in this order)
                label_singular: Layer
                widget: list
                field: { name: layer, label: Layer, widget: string }
                hint: "base64, hex, url, rot13, reverse, or xor:KEY (0-255, e.g. xor:66). The site encodes the message for you. After xor, finish with base64, hex or url."
              - { name: hint, label: Hint, widget: text }
              - { name: explain, label: Explanation (shown when solved), widget: text }

      - name: rules
        label: Write the rule
        file: src/data/rules.json
        format: json
        fields:
          - name: rounds
            label: Rounds
            label_singular: Round
            collapsed: auto
            widget: list
            summary: "{{fields.title}}"
            hint: "Samples must be made up and harmless. The solution has to sort every sample correctly; the starter must not."
            fields:
              - { name: title, label: Title, widget: string }
              - { name: brief, label: Brief, widget: text }
              - { name: hint, label: Hint, widget: text }
              - { name: starter, label: Starter rule, widget: code, output_code_only: true, allow_language_selection: false }
              - { name: solution, label: Example solution, widget: code, output_code_only: true, allow_language_selection: false }
              - { name: explain, label: Explanation (shown when solved), widget: text }
              - name: samples
                label: Samples
                label_singular: Sample
                collapsed: auto
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: File name, widget: string }
                  - { name: malicious, label: "Malicious?", widget: boolean, default: false }
                  - { name: text, label: Contents, widget: text, hint: "Optional placeholders: {n4} = one random 4-digit number shared by the whole round, {r6} = a new random 6-character token each time" }

      - name: permissions
        label: Permissions lab
        file: src/data/permissions.json
        format: json
        fields:
          - name: challenges
            label: Tasks
            label_singular: Task
            collapsed: auto
            widget: list
            summary: "{{fields.file}} ({{fields.answer}})"
            fields:
              - { name: file, label: File or folder name, widget: string }
              - { name: directory, label: "Is it a folder?", widget: boolean, default: false }
              - { name: group, label: Group, widget: string, default: staff }
              - { name: task, label: Task, widget: text, hint: "Word it so only one answer fits" }
              - { name: answer, label: Answer (octal), widget: string, pattern: ["^[0-7]{3}$", "Three digits from 0 to 7, e.g. 750"] }
              - { name: explain, label: Explanation (shown when correct), widget: text }

      - name: triage
        label: Alert triage
        file: src/data/triage.json
        format: json
        fields:
          - name: alerts
            label: Alert templates
            label_singular: Alert template
            collapsed: auto
            widget: list
            summary: "{{fields.rule}} ({{fields.severity}})"
            hint: "Each shift deals 4 benign and 4 escalate alerts. Placeholders filled in at random: {user} {host} {ip} {lan} {n} {n4}"
            fields:
              - { name: rule, label: Alert name, widget: string }
              - { name: severity, label: Severity, widget: select, options: [Low, Medium, High, Critical] }
              - { name: details, label: What the alert shows, widget: text }
              - { name: escalate, label: "Should it be escalated?", widget: boolean, default: false }
              - { name: why, label: Why, widget: text }
              - { name: next, label: What a defender does next, widget: text }

      - name: infections
        label: Classify the infection
        file: src/data/infections.json
        format: json
        fields:
          - name: types
            label: Malware types
            label_singular: Malware type
            collapsed: auto
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { name: id, label: ID, widget: string, hint: "Short, lowercase, used by the notes below" }
              - { name: label, label: Name, widget: string }
              - { name: about, label: One-line description, widget: string }
              - { name: respond, label: How defenders respond, widget: list, field: { name: step, label: Step, widget: string } }
          - name: notes
            label: Incident notes
            label_singular: Incident note
            collapsed: auto
            widget: list
            summary: "{{fields.type}}: {{fields.note}}"
            hint: "Describe only what a defender would see (symptoms, timing, network behaviour), never how the malware works inside."
            fields:
              - { name: type, label: Type ID, widget: string }
              - { name: note, label: Note, widget: text }

      - name: query
        label: Fix the query
        file: src/data/query.json
        format: json
        fields:
          - name: rounds
            label: Rounds
            label_singular: Round
            collapsed: auto
            widget: list
            summary: "{{fields.title}}"
            hint: "Exactly one option per round is correct, and each option needs one true/false result per test."
            fields:
              - { name: title, label: Title, widget: string }
              - { name: context, label: Context, widget: text }
              - { name: code, label: Unsafe code, widget: code, output_code_only: true, allow_language_selection: false }
              - { name: why, label: Why it's unsafe, widget: text }
              - { name: tests, label: Tests, widget: list, field: { name: test, label: Test, widget: string } }
              - name: options
                label: Fixes to choose from
                label_singular: Fix
                collapsed: auto
                widget: list
                summary: "{{fields.correct | ternary('Correct · ', '')}}{{fields.code | truncate(60)}}"
                fields:
                  - { name: code, label: Code, widget: code, output_code_only: true, allow_language_selection: false }
                  - { name: correct, label: "Is this the fix to approve?", widget: boolean, default: false }
                  - { name: tests, label: Test results (in order), widget: list, field: { name: pass, label: Passes, widget: boolean } }
                  - { name: feedback, label: Feedback, widget: text }
              - { name: takeaway, label: Takeaway, widget: text }

  - divider: true

  - name: settings
    label: Settings
    icon: settings
    description: "Site name, contact details, menus and footer, plus the categories used across the site."
    editor: { preview: false }
    files:
      - name: site
        label: Site
        file: src/content/site.json
        format: json
        fields:
          - { name: name, label: Site name, widget: string }
          - { name: role, label: Short description, widget: string, hint: "Shown after the name in the homepage's browser tab." }
          - { name: description, label: Search engine description, widget: text, hint: "Used by Google and link previews for the homepage, and any page without its own." }
          - { name: email, label: Contact email, widget: string }
          - { name: discord, label: Discord invite link, widget: string }
          - name: nav
            label: Top menu
            label_singular: Menu item
            collapsed: auto
            widget: list
            summary: "{{fields.label}} → {{fields.href}}"
            hint: "The item linking to /join is shown as a button."
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: Link, widget: string }
          - name: footerNav
            label: Footer menu
            label_singular: Menu item
            collapsed: auto
            widget: list
            summary: "{{fields.label}} → {{fields.href}}"
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: Link, widget: string }
          - name: socials
            label: Social links
            label_singular: Social link
            collapsed: auto
            widget: list
            summary: "{{fields.label}}"
            hint: "In the footer."
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: Link, widget: string }
          - { name: footerNote, label: Footer note, widget: string, hint: "Next to the green dot under the email address." }
          - { name: maintainerName, label: Maintained by, widget: string }
          - { name: maintainerUrl, label: Maintainer link, widget: string }
          - { name: year, label: Copyright year, widget: string }
          - name: comments
            label: Article comments (technical)
            widget: object
            collapsed: true
            hint: "GitHub Discussions settings for comments. Set up by a developer: see src/components/Comments.astro."
            fields:
              - { name: repo, label: Repository, widget: string }
              - { name: repoId, label: Repository ID, widget: string }
              - { name: category, label: Category, widget: string }
              - { name: categoryId, label: Category ID, widget: string }

      - name: categories
        label: Categories
        file: src/data/categories.json
        format: json
        fields:
          - name: articles
            label: Article categories
            label_singular: Category
            collapsed: auto
            widget: list
            summary: "{{fields.name}}"
            hint: "Each category with at least one article gets a filter button on /articles, in this order."
            fields:
              - { name: name, label: Name, widget: string }
              - { name: description, label: Description, widget: string, required: false }
          - name: resources
            label: Resource categories
            label_singular: Category
            collapsed: auto
            widget: list
            summary: "{{fields.name}}"
            hint: "Sections of the /resources page, in this order."
            fields:
              - { name: name, label: Name, widget: string }
              - { name: description, label: Description, widget: string, required: false }
          - name: roles
            label: Team roles
            label_singular: Role
            collapsed: auto
            widget: list
            summary: "{{fields.name}}"
            hint: "Roles people can have on the team page, in this order."
            fields:
              - { name: name, label: Name, widget: string, hint: "Singular, e.g. Author" }
              - { name: plural, label: Plural, widget: string, hint: "e.g. Authors" }
              - { name: onlyOne, label: Only one person, widget: boolean, default: false, required: false, hint: "For roles like Founder. The site won't build if two people have it." }
              - { name: description, label: What they do, widget: string }
          - name: glossary
            label: Glossary topics
            label_singular: Topic
            collapsed: auto
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Name, widget: string }
